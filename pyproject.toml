[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockout-aware-retail-analytics"
version = "0.1.0"
description = "Stockout-aware retail forecasting and inventory analytics"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]